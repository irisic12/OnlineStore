<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Товары заказа</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <script>
    function checkItemsBeforeLeave(event) {
      const itemCount = document.getElementById('itemCount').value;
      if (itemCount === '0') {
        event.preventDefault();
        alert('В заказе нет товаров. Сначала добавьте товары.');
        return false;
      }
      return true;
    }
  </script>
</head>
<body>
<div class="container mt-4">
  <h1>Товары заказа #<span th:text="${order.id}"></span></h1>
  <p>Дата: <span th:text="${#dates.format(order.orderDate, 'dd.MM.yyyy')}"></span></p>
  <p>Клиент: <span th:text="${order.customer.firstName + ' ' + order.customer.lastName}"></span></p>

  <!-- Скрытое поле с количеством товаров -->
  <input type="hidden" id="itemCount" th:value="${orderItems.size()}">

  <!-- Сообщения -->
  <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
    <span th:text="${errorMessage}"></span>
  </div>

  <div th:if="${successMessage}" class="alert alert-success" role="alert">
    <span th:text="${successMessage}"></span>
  </div>

  <!-- Блок добавления товара (только если можно редактировать) -->
  <div th:if="${canEdit}">
    <h3>Добавить товар</h3>
    <form th:action="@{/user/orders/{orderId}/items/add(orderId=${order.id})}" method="post">
      <input type="hidden" name="from" th:value="${param.from != null ? param.from[0] : ''}">
      <div class="row mb-3">
        <div class="col-md-5">
          <select class="form-select" name="productId" required>
            <option value="">Выберите товар</option>
            <option th:each="product : ${allProducts}"
                    th:value="${product.id}"
                    th:text="${product.name + ' (' + product.price + ' ₽)'}"></option>
          </select>
        </div>
        <div class="col-md-3">
          <input type="number" class="form-control" name="quantity" min="1" value="1" required>
        </div>
        <div class="col-md-4">
          <button type="submit" class="btn btn-primary">Добавить</button>
        </div>
      </div>
    </form>
  </div>

  <!-- Сообщение для режима только просмотр -->
  <div th:unless="${canEdit}" class="alert alert-info">
    <i class="bi bi-info-circle"></i>
    <span th:text="${source == 'orders-list' ? 'Просмотр заказа из истории.' : 'Редактирование недоступно.'}"></span>
  </div>

  <h3 class="mt-4">Список товаров</h3>
  <table class="table table-striped">
    <thead>
    <tr>
      <th>Товар</th>
      <th>Цена</th>
      <th>Количество</th>
      <th>Сумма</th>
      <th th:if="${canEdit}">Действия</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="item : ${orderItems}">
      <td th:text="${item.product.name}"></td>
      <td th:text="${item.price} + ' ₽'"></td>
      <td>
        <div th:if="${canEdit}">
          <form th:action="@{/user/orders/{orderId}/items/update(orderId=${order.id})}"
                method="post" style="display: inline-block;">
            <input type="hidden" name="productId" th:value="${item.product.id}">
            <input type="hidden" name="from" th:value="${param.from != null ? param.from[0] : ''}">
            <input type="number" name="quantity" th:value="${item.quantity}"
                   min="1" class="form-control" style="width: 80px; display: inline-block;">
            <button type="submit" class="btn btn-sm btn-warning">Обновить</button>
          </form>
        </div>
        <div th:unless="${canEdit}" th:text="${item.quantity}"></div>
      </td>
      <td th:text="${item.price * item.quantity} + ' ₽'"></td>
      <td th:if="${canEdit}">
        <form th:action="@{/user/orders/{orderId}/items/delete(orderId=${order.id})}"
              method="post" style="display: inline;">
          <input type="hidden" name="productId" th:value="${item.product.id}">
          <input type="hidden" name="from" th:value="${param.from != null ? param.from[0] : ''}">
          <button type="submit" class="btn btn-sm btn-danger">Удалить</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>

  <div class="mt-3">
    <!-- Кнопка возврата -->
    <th:block th:if="${param.from != null and param.from[0] == 'list'}">
      <a th:href="@{/user/orders}"
         class="btn btn-secondary"
         onclick="return checkItemsBeforeLeave(event)">
        Назад к списку заказов
      </a>
    </th:block>

    <th:block th:if="${param.from == null or param.from[0] != 'list'}">
      <a th:href="@{/user/orders/edit/{id}(id=${order.id})}"
         class="btn btn-secondary"
         onclick="return checkItemsBeforeLeave(event)">
        Вернуться к заказу
      </a>
    </th:block>
  </div>
</div>

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
