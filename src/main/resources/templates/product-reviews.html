<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Отзывы о товаре</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .rating-stars {
            color: #ffc107;
            font-size: 1.2rem;
        }
        .review-item {
            border-bottom: 1px solid #dee2e6;
            padding: 15px 0;
        }
        .review-item:last-child {
            border-bottom: none;
        }
        .review-author {
            font-weight: bold;
            color: #495057;
        }
        .review-date {
            color: #6c757d;
            font-size: 0.85rem;
        }
        .review-comment {
            margin-top: 10px;
            font-style: italic;
            background-color: #f8f9fa;
            padding: 10px;
            border-radius: 5px;
        }
        .average-rating {
            font-size: 2rem;
            font-weight: bold;
            color: #ffc107;
        }
    </style>
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Отзывы о товаре</h1>
        <a th:href="@{/products}" class="btn btn-secondary">Назад к каталогу</a>
    </div>

    <!-- Информация о товаре -->
    <div class="card mb-4">
        <div class="card-body">
            <div class="row">
                <div class="col-md-8">
                    <h3 th:text="${product.name}"></h3>
                    <p th:text="${product.description}"></p>
                    <p><strong>Категория:</strong> <span th:text="${product.category?.name ?: 'Без категории'}"></span></p>
                    <p><strong>Цена:</strong> <span class="text-primary fs-4" th:text="${product.price} + ' ₽'"></span></p>
                </div>
                <div class="col-md-4 text-center">
                    <div class="average-rating" th:text="${#numbers.formatDecimal(product.averageRating, 1, 1)}"></div>
                    <div class="rating-stars" th:text="${product.getRatingStars()}"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Сообщение, если нет отзывов -->
    <div th:if="${reviews == null or reviews.isEmpty()}" class="alert alert-info text-center py-5">
        <h4 class="mb-3">У этого товара пока нет отзывов</h4>
        <p class="mb-4">Будьте первым, кто оставит отзыв!</p>
    </div>

    <!-- Список отзывов -->
    <div th:unless="${reviews == null or reviews.isEmpty()}">
        <h4 class="mb-3">Все отзывы (<span th:text="${reviews.size()}"></span>)</h4>

        <div class="list-group">
            <div th:each="review : ${reviews}" class="review-item">
                <div class="d-flex justify-content-between">
                    <div>
                        <span class="review-author" th:text="${review.customer.fullName}"></span>
                    </div>
                    <div class="rating-stars">
                        <span th:text="${review.rating} + ' ⭐'"></span>
                    </div>
                </div>
                <div class="review-comment" th:text="${review.comment ?: 'Без комментария'}"></div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
