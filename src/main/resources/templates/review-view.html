<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Просмотр отзыва</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h1>Просмотр отзыва</h1>

    <div class="card mt-4">
        <div class="card-header">
            <h5>Информация об отзыве</h5>
        </div>
        <div class="card-body">
            <div class="row mb-3">
                <div class="col-md-3 fw-bold">Товар:</div>
                <div class="col-md-9" th:text="${review.product.name}"></div>
            </div>
            <div class="row mb-3">
                <div class="col-md-3 fw-bold">Заказ №:</div>
                <div class="col-md-9" th:text="${review.order.id}"></div>
            </div>
            <div class="row mb-3">
                <div class="col-md-3 fw-bold">Оценка:</div>
                <div class="col-md-9">
                    <span th:if="${review.rating == 1}">1 ⭐</span>
                    <span th:if="${review.rating == 2}">2 ⭐⭐</span>
                    <span th:if="${review.rating == 3}">3 ⭐⭐⭐</span>
                    <span th:if="${review.rating == 4}">4 ⭐⭐⭐⭐</span>
                    <span th:if="${review.rating == 5}">5 ⭐⭐⭐⭐⭐</span>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-3 fw-bold">Комментарий:</div>
                <div class="col-md-9" th:text="${review.comment ?: 'Нет комментария'}"></div>
            </div>
        </div>
    </div>

    <div class="mt-3">
        <a th:href="@{/user/orders/{id}/items(id=${review.order.id})}" class="btn btn-secondary">
            Назад к товарам заказа
        </a>
    </div>
</div>
</body>
</html>
