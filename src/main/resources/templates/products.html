<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${isAdmin} ? 'Управление продуктами' : 'Каталог товаров'"></title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    .rating-stars {
      color: #ffc107;
      font-size: 1.2rem;
    }
    .rating-number {
      color: #6c757d;
      font-size: 0.9rem;
      margin-left: 5px;
    }
  </style>
</head>
<body>
<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 th:text="${isAdmin} ? 'Управление продуктами' : 'Каталог товаров'"></h1>
    <div>
      <!-- Кнопка корзины для пользователя -->
      <a th:if="${!isAdmin}" th:href="@{/cart}" class="btn btn-success me-2">
        🛒 Корзина <span th:if="${session.cart != null and !session.cart.items.isEmpty()}"
                        class="badge bg-danger" th:text="${session.cart.totalItems}"></span>
      </a>
      <a th:if="${isAdmin}" th:href="@{/products/add}" class="btn btn-primary me-2">Добавить продукт</a>
      <a th:href="@{/}" class="btn btn-secondary">На главную</a>
    </div>
  </div>

  <!-- Форма поиска и фильтрации -->
  <div class="card mb-4">
    <div class="card-header">
      <h5>Фильтры</h5>
    </div>
    <div class="card-body">
      <form method="get" action="/products" class="row g-3">
        <div class="col-md-4">
          <label for="search" class="form-label">Поиск по названию</label>
          <input type="text" class="form-control" id="search" name="search"
                 th:value="${searchQuery}">
        </div>

        <div class="col-md-3">
          <label for="categoryId" class="form-label">Категория</label>
          <select class="form-select" id="categoryId" name="categoryId">
            <option value="">Все категории</option>
            <option th:each="category : ${categories}"
                    th:value="${category.id}"
                    th:text="${category.name}"
                    th:selected="${category.id == selectedCategory}"></option>
          </select>
        </div>

        <div class="col-md-3 d-flex align-items-end">
          <button type="submit" class="btn btn-primary me-2">Применить</button>
          <a th:href="@{/products}" class="btn btn-secondary">Сброс</a>
        </div>
      </form>
    </div>
  </div>

  <!-- Таблица товаров -->
  <table class="table table-striped">
    <thead>
    <tr>
      <th>Название</th>
      <th>Цена</th>
      <th>Категория</th>
      <th>Описание</th>
      <th>Рейтинг</th>
      <th>Отзывы</th>
      <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="product : ${products}">
      <td th:text="${product.name}"></td>
      <td th:text="${product.price} + ' ₽'"></td>
      <td th:text="${product.category?.name}"></td>
      <td th:text="${product.description}"></td>

      <!-- Рейтинг -->
      <td>
        <div class="rating-stars" th:text="${product.getRatingStars()}"></div>
        <span class="rating-number" th:text="'(' + ${#numbers.formatDecimal(product.averageRating, 1, 1)} + ')'"></span>
      </td>

      <!-- Отзывы -->
      <td>
        <a th:href="@{/products/{id}/reviews(id=${product.id})}"
           class="btn btn-sm btn-outline-info">
          👁️ Смотреть отзывы
        </a>
      </td>

      <!-- Действия -->
      <td>
        <div th:if="${isAdmin}">
          <a th:href="@{/products/edit/{id}(id=${product.id})}" class="btn btn-sm btn-warning">Редактировать</a>
          <a th:href="@{/products/delete/{id}(id=${product.id})}" class="btn btn-sm btn-danger">Удалить</a>
        </div>
        <div th:unless="${isAdmin}">
          <form th:action="@{/cart/add}" method="post" class="d-flex">
            <input type="hidden" name="productId" th:value="${product.id}">
            <input type="number" name="quantity" value="1" min="1"
                   class="form-control me-2" style="width: 80px;">
            <button type="submit" class="btn btn-sm btn-success">В корзину</button>
          </form>
        </div>
      </td>
    </tr>
    </tbody>
  </table>

  <!-- Сообщение, если товаров нет -->
  <div th:if="${products == null or products.isEmpty()}" class="alert alert-info text-center py-4">
    <h5>Товары не найдены</h5>
    <p class="mb-0">Попробуйте изменить параметры поиска.</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
