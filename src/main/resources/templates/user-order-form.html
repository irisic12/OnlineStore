<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${order.id} ? 'Просмотр заказа' : 'Добавление заказа'"></title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center">
    <h1 th:text="${order.id} ? 'Просмотр заказа' : 'Добавление заказа'"></h1>

    <!-- Кнопка перехода к товарам (только для существующих заказов) -->
    <a th:if="${order.id != null}"
       th:href="@{/user/orders/{id}/items(id=${order.id}, source='form')}"  // ← добавляем параметр source=form
    class="btn btn-info">
    Перейти к товарам
    </a>
  </div>

  <!-- Отображение ошибок -->
  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

  <!-- Если readonly=true, показываем информацию без формы -->
  <div th:if="${readonly}" class="mt-3">
    <div class="card">
      <div class="card-body">
        <h5 class="card-title">Информация о заказе #<span th:text="${order.id}"></span></h5>

        <div class="row mb-2">
          <div class="col-md-3 fw-bold">Дата заказа:</div>
          <div class="col-md-9" th:text="${#dates.format(order.orderDate, 'dd.MM.yyyy')}"></div>
        </div>

        <div class="row mb-2">
          <div class="col-md-3 fw-bold">Клиент:</div>
          <div class="col-md-9" th:text="${currentCustomerName}"></div>
        </div>

        <div class="row mb-2">
          <div class="col-md-3 fw-bold">Статус:</div>
          <div class="col-md-9" th:text="${T(com.example.demo.helpClass.DisplayNames).getDisplayName(order.status)}"></div>
        </div>

        <div class="row mb-2">
          <div class="col-md-3 fw-bold">Способ оплаты:</div>
          <div class="col-md-9" th:text="${T(com.example.demo.helpClass.DisplayNames).getDisplayName(order.paymentMethod)}"></div>
        </div>

        <div class="row mb-2">
          <div class="col-md-3 fw-bold">Адрес доставки:</div>
          <div class="col-md-9" th:text="${order.shippingAddress}"></div>
        </div>

        <div class="row mb-2">
          <div class="col-md-3 fw-bold">Сумма:</div>
          <div class="col-md-9 fw-bold text-primary" th:text="${order.totalAmount} + ' ₽'"></div>
        </div>
      </div>
    </div>

    <div class="mt-3">
      <a th:href="@{/user/orders}" class="btn btn-secondary">Назад к списку заказов</a>
    </div>
  </div>

  <!-- Форма для создания нового заказа (только если не readonly) -->
  <form th:unless="${readonly}" th:action="@{/user/orders/add}" method="post">
    <input type="hidden" name="id" th:value="${order.id}">

    <!-- Дата заказа (только для чтения) -->
    <div class="mb-3">
      <label for="orderDate" class="form-label">Дата заказа</label>
      <input type="date" class="form-control" id="orderDate" name="orderDate"
             th:value="${#dates.format(new java.util.Date(), 'yyyy-MM-dd')}"
             readonly disabled>
    </div>

    <!-- Клиент (только для чтения) -->
    <input type="hidden" name="customerId" th:value="${currentCustomerId}">
    <div class="mb-3">
      <label for="customerName" class="form-label">Клиент</label>
      <input type="text" class="form-control" id="customerName"
             th:value="${currentCustomerName}" readonly disabled>
    </div>

    <!-- Статус (скрытое поле) -->
    <input type="hidden" name="status" value="CREATED">

    <!-- Способ оплаты -->
    <div class="mb-3">
      <label for="paymentMethod" class="form-label">Способ оплаты</label>
      <select class="form-select" id="paymentMethod" name="paymentMethod" required>
        <option value="">Выберите способ оплаты</option>
        <option th:each="method : ${T(com.example.demo.enums.PaymentMethod).values()}"
                th:value="${method}"
                th:text="${T(com.example.demo.helpClass.DisplayNames).getDisplayName(method)}"
                th:selected="${order.paymentMethod == method}"></option>
      </select>
    </div>

    <!-- Адрес доставки -->
    <div class="mb-3">
      <label for="shippingAddress" class="form-label">Адрес доставки</label>
      <textarea class="form-control" id="shippingAddress" name="shippingAddress" rows="3" required
                th:text="${order.shippingAddress}"></textarea>
    </div>

    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a th:href="@{/user/orders}" class="btn btn-secondary">Отмена</a>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
