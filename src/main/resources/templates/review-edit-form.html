<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Редактировать отзыв</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
  <h1>Редактировать отзыв</h1>

  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

  <div class="card mt-4">
    <div class="card-header">
      <h5>Товар: <span th:text="${review.product.name}"></span></h5>
    </div>
    <div class="card-body">
      <form th:action="@{/reviews/update/{id}(id=${review.id})}" method="post">
        <input type="hidden" name="productId" th:value="${review.product.id}">
        <input type="hidden" name="orderId" th:value="${review.order.id}">

        <div class="mb-3">
          <label class="form-label">Оценка</label>
          <div class="rating">
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="rating" id="rating1" value="1" th:checked="${review.rating == 1}" required>
              <label class="form-check-label" for="rating1">1 ⭐</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="rating" id="rating2" value="2" th:checked="${review.rating == 2}">
              <label class="form-check-label" for="rating2">2 ⭐⭐</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="rating" id="rating3" value="3" th:checked="${review.rating == 3}">
              <label class="form-check-label" for="rating3">3 ⭐⭐⭐</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="rating" id="rating4" value="4" th:checked="${review.rating == 4}">
              <label class="form-check-label" for="rating4">4 ⭐⭐⭐⭐</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="rating" id="rating5" value="5" th:checked="${review.rating == 5}">
              <label class="form-check-label" for="rating5">5 ⭐⭐⭐⭐⭐</label>
            </div>
          </div>
        </div>

        <div class="mb-3">
          <label for="comment" class="form-label">Комментарий</label>
          <textarea class="form-control" id="comment" name="comment" rows="4" th:text="${review.comment}"></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Сохранить изменения</button>
        <a th:href="@{/user/orders/{id}/items(id=${review.order.id})}" class="btn btn-secondary">Отмена</a>
      </form>
    </div>
  </div>
</div>
</body>
</html>
