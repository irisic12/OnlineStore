<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Форма клиента</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
  <h1 th:text="${customerRequest != null && customerRequest.id != null} ? 'Редактирование клиента' : 'Добавление клиента'">
    Добавление клиента
  </h1>

  <!-- Сообщения об ошибках -->
  <div th:if="${error}" class="alert alert-danger">
    <span th:text="${error}"></span>
  </div>

  <!-- Форма -->
  <form th:action="${customerRequest != null && customerRequest.id != null} ?
                     '/customers/update/' + ${customerRequest.id} :
                     '/customers/add'"
        method="post">

    <!-- Скрытое поле для ID -->
    <input type="hidden" th:if="${customerRequest != null && customerRequest.id != null}"
           name="id" th:value="${customerRequest.id}">

    <!-- Основные данные -->
    <div class="row">
      <div class="col-md-6 mb-3">
        <label for="firstName" class="form-label">Имя *</label>
        <input type="text" id="firstName" name="firstName"
               class="form-control" placeholder="Иван"
               th:value="${customerRequest != null ? customerRequest.firstName : ''}"
               required>
      </div>
      <div class="col-md-6 mb-3">
        <label for="lastName" class="form-label">Фамилия *</label>
        <input type="text" id="lastName" name="lastName"
               class="form-control" placeholder="Иванов"
               th:value="${customerRequest != null ? customerRequest.lastName : ''}"
               required>
      </div>
    </div>

    <!-- Поля только для создания нового пользователя -->
    <div th:unless="${customerRequest != null && customerRequest.id != null}">
      <div class="row">
        <div class="col-md-6 mb-3">
          <label for="username" class="form-label">Логин *</label>
          <input type="text" id="username" name="username"
                 class="form-control" placeholder="ivanov"
                 th:value="${customerRequest != null ? customerRequest.username : ''}"
                 required>
        </div>
        <div class="col-md-6 mb-3">
          <label for="password" class="form-label">Пароль *</label>
          <input type="password" id="password" name="password"
                 class="form-control" placeholder="Минимум 6 символов" required>
        </div>
      </div>
    </div>

    <!-- Email -->
    <div class="mb-3">
      <label for="email" class="form-label">Email *</label>
      <input type="email" id="email" name="email"
             class="form-control"
             th:readonly="${customerRequest != null && customerRequest.id != null}"
             th:value="${customerRequest != null ? customerRequest.email : ''}"
             placeholder="ivanov@example.com" required>
    </div>

    <!-- Телефон -->
    <div class="mb-3">
      <label for="phone" class="form-label">Телефон *</label>
      <input type="tel" id="phone" name="phone"
             class="form-control" placeholder="+7 (999) 123-45-67"
             th:value="${customerRequest != null ? customerRequest.phone : ''}"
             required>
    </div>

    <!-- Адрес -->
    <div class="mb-3">
      <label for="address" class="form-label">Адрес *</label>
      <textarea id="address" name="address"
                class="form-control" rows="3"
                placeholder="Город, улица, дом, квартира" required
                th:text="${customerRequest != null ? customerRequest.address : ''}"></textarea>
    </div>

    <!-- Кнопки -->
    <div class="d-flex justify-content-between">
      <button type="submit" class="btn btn-primary">
                <span th:text="${customerRequest != null && customerRequest.id != null} ? 'Сохранить изменения' : 'Добавить клиента'">
                    Добавить клиента
                </span>
      </button>
      <a th:href="@{/customers}" class="btn btn-secondary">Отмена</a>
    </div>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
