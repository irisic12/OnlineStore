<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Мои заказы</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h1>Мои заказы</h1>

    <a th:href="@{/user/orders/add}" class="btn btn-primary mb-3">Добавить заказ</a>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>Дата заказа</th>
            <th>Клиент</th>
            <th>Сумма</th>
            <th>Статус</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="order : ${orders}">
            <td th:text="${order.orderDate != null ? #dates.format(order.orderDate, 'dd.MM.yyyy') : ''}"></td>
            <td th:text="${order.customer.firstName + ' ' + order.customer.lastName}"></td>
            <td th:text="${order.totalAmount}"></td>
            <td th:text="${T(com.example.demo.helpClass.DisplayNames).getDisplayName(order.status)}"></td>
            <td>
                <a th:href="@{/user/orders/edit/{id}(id=${order.id})}" class="btn btn-sm btn-warning">Просмотр</a>

                <!-- ИЗМЕНЕНА ТОЛЬКО ЭТА КНОПКА -->
                <th:block th:with="canDelete=${order.status.name() == 'CREATED' or order.status.name() == 'PAID' or order.status.name() == 'PROCESSING'}">
                    <a th:href="@{/user/orders/delete/{id}(id=${order.id})}"
                       class="btn btn-sm"
                       th:classappend="${canDelete} ? 'btn-danger' : 'btn-secondary disabled'"
                       th:onclick="${canDelete} ? 'return confirm(\'Удалить заказ?\')' : 'return false;'">
                        Удалить
                    </a>
                </th:block>

                <a th:href="@{/user/orders/{id}/items(id=${order.id}, from='list')}" class="btn btn-sm btn-info">Товары</a>
            </td>
        </tr>
        </tbody>
    </table>

    <a th:href="@{/}" class="btn btn-secondary">На главную</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
