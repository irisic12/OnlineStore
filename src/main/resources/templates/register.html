<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow">
                <div class="card-body">
                    <h2 class="text-center mb-4">Регистрация нового клиента</h2>

                    <!-- Сообщения -->
                    <div th:if="${success}" class="alert alert-success">
                        <span th:text="${success}"></span>
                    </div>

                    <!-- Форма регистрации -->
                    <form th:action="@{/register}" method="post" th:object="${registerRequest}">

                        <!-- Логин -->
                        <div class="mb-3">
                            <label for="username" class="form-label">Логин *</label>
                            <input type="text" id="username" th:field="*{username}"
                                   class="form-control" placeholder="Придумайте логин" required>
                            <div class="text-danger" th:if="${#fields.hasErrors('username')}"
                                 th:errors="*{username}"></div>
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label for="email" class="form-label">Email *</label>
                            <input type="email" id="email" th:field="*{email}"
                                   class="form-control" placeholder="example@domain.com" required>
                            <div class="text-danger" th:if="${#fields.hasErrors('email')}"
                                 th:errors="*{email}"></div>
                        </div>

                        <!-- Пароль -->
                        <div class="mb-3">
                            <label for="password" class="form-label">Пароль *</label>
                            <input type="password" id="password" th:field="*{password}"
                                   class="form-control" placeholder="Минимум 6 символов" required>
                            <div class="text-danger" th:if="${#fields.hasErrors('password')}"
                                 th:errors="*{password}"></div>
                        </div>

                        <!-- Имя и Фамилия -->
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="firstName" class="form-label">Имя *</label>
                                <input type="text" id="firstName" th:field="*{firstName}"
                                       class="form-control" placeholder="Иван" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="lastName" class="form-label">Фамилия *</label>
                                <input type="text" id="lastName" th:field="*{lastName}"
                                       class="form-control" placeholder="Иванов" required>
                            </div>
                        </div>

                        <!-- Телефон -->
                        <div class="mb-3">
                            <label for="phone" class="form-label">Телефон *</label>
                            <input type="tel" id="phone" th:field="*{phone}"
                                   class="form-control" placeholder="+7 (999) 123-45-67" required>
                        </div>

                        <!-- Адрес -->
                        <div class="mb-3">
                            <label for="address" class="form-label">Адрес доставки *</label>
                            <textarea id="address" th:field="*{address}"
                                      class="form-control" rows="3"
                                      placeholder="Город, улица, дом, квартира" required></textarea>
                        </div>

                        <!-- Кнопки -->
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">
                                Зарегистрироваться
                            </button>
                            <a th:href="@{/login}" class="btn btn-outline-secondary">
                                Уже есть аккаунт? Войти
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
