<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Товары заказа</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <script>
    function checkItemsBeforeLeave(event) {
      const itemCount = document.getElementById('itemCount').value;
      if (itemCount === '0') {
        event.preventDefault();
        alert('В заказе нет товаров. Сначала добавьте товары.');
        return false;
      }
      return true;
    }
  </script>
</head>
<body>
<div class="container mt-4">
  <h1>Товары заказа #<span th:text="${order.id}"></span></h1>
  <p>Дата: <span th:text="${#dates.format(order.orderDate, 'dd.MM.yyyy')}"></span></p>
  <p>Клиент: <span th:text="${order.customer.firstName + ' ' + order.customer.lastName}"></span></p>

  <!-- Скрытое поле с количеством товаров -->
  <input type="hidden" id="itemCount" th:value="${orderItems.size()}">

  <!-- Сообщения -->
  <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
    <span th:text="${errorMessage}"></span>
  </div>

  <div th:if="${successMessage}" class="alert alert-success" role="alert">
    <span th:text="${successMessage}"></span>
  </div>

  <h3>Добавить товар</h3>
  <form th:action="@{/orders/{orderId}/items/add(orderId=${order.id})}" method="post">
    <input type="hidden" name="from" th:value="${param.from != null ? param.from : ''}">
    <div class="row mb-3">
      <div class="col-md-5">
        <select class="form-select" name="productId" required>
          <option value="">Выберите товар</option>
          <option th:each="product : ${allProducts}"
                  th:value="${product.id}"
                  th:text="${product.name + ' (' + product.price + ' ₽)'}"></option>
        </select>
      </div>
      <div class="col-md-3">
        <input type="number" class="form-control" name="quantity" min="1" value="1" required>
      </div>
      <div class="col-md-4">
        <button type="submit" class="btn btn-primary">Добавить</button>
      </div>
    </div>
  </form>

  <h3 class="mt-4">Список товаров</h3>
  <table class="table table-striped">
    <thead>
    <tr>
      <th>Товар</th>
      <th>Цена</th>
      <th>Количество</th>
      <th>Сумма</th>
      <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="item : ${orderItems}">
      <td th:text="${item.product.name}"></td>
      <td th:text="${item.price} + ' ₽'"></td>
      <td>
        <form th:action="@{/orders/{orderId}/items/update(orderId=${order.id})}"
              method="post">
          <input type="hidden" name="productId" th:value="${item.product.id}">
          <input type="hidden" name="from" th:value="${param.from != null ? param.from : ''}">
          <input type="number" name="quantity" th:value="${item.quantity}"
                 min="1" class="form-control me-2" style="width: 80px;">
          <button type="submit" class="btn btn-sm btn-warning">Обновить</button>
        </form>
      </td>
      <td th:text="${item.price * item.quantity} + ' ₽'"></td>
      <td>
        <form th:action="@{/orders/{orderId}/items/delete(orderId=${order.id})}"
              method="post">
          <input type="hidden" name="productId" th:value="${item.product.id}">
          <input type="hidden" name="from" th:value="${param.from != null ? param.from : ''}">
          <button th:if="${order.status == OrderStatus.}" type="submit" class="btn btn-sm btn-danger">Удалить</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>

  <div class="mt-3">
    <!-- Кнопка возврата с проверкой -->
    <a th:href="@{${backUrl}}"
       class="btn btn-secondary"
       onclick="return checkItemsBeforeLeave(event)">
      <span th:text="${backText}">Назад</span>
    </a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
