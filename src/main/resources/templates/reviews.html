<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Модерация отзывов</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Модерация отзывов</h1>
        <a th:href="@{/}" class="btn btn-secondary">Назад в админку</a>
    </div>

    <!-- Сообщения -->
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <!-- Отзывы на модерации -->
    <div class="card mb-4">
        <div class="card-header bg-warning text-white">
            <h5>Отзывы на модерации (<span th:text="${pendingReviews.size()}"></span>)</h5>
        </div>
        <div class="card-body">
            <div th:if="${pendingReviews.isEmpty()}" class="alert alert-info">
                Нет отзывов на модерации
            </div>
            <div th:unless="${pendingReviews.isEmpty()}" class="list-group">
                <div th:each="review : ${pendingReviews}" class="list-group-item">
                    <div class="d-flex justify-content-between">
                        <div>
                            <h6>
                                <span th:text="${review.customer.fullName}"></span>
                                <span class="badge bg-secondary ms-2">⭐ <span th:text="${review.rating}"></span></span>
                            </h6>
                            <p class="mb-1" th:text="${review.comment ?: 'Без комментария'}"></p>
                            <small class="text-muted">
                                Товар: <span th:text="${review.product.name}"></span>
                            </small>
                        </div>
                        <div>
                            <form th:action="@{/admin/reviews/approve/{id}(id=${review.id})}" method="post" style="display: inline;">
                                <button type="submit" class="btn btn-sm btn-success"
                                        onclick="return confirm('Одобрить отзыв?')">
                                    ✓ Одобрить
                                </button>
                            </form>
                            <form th:action="@{/admin/reviews/reject/{id}(id=${review.id})}" method="post" style="display: inline;">
                                <button type="submit" class="btn btn-sm btn-danger"
                                        onclick="return confirm('Отклонить и удалить отзыв?')">
                                    ✗ Отклонить
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Одобренные отзывы -->
    <div class="card">
        <div class="card-header bg-success text-white">
            <h5>Одобренные отзывы (<span th:text="${approvedReviews.size()}"></span>)</h5>
        </div>
        <div class="card-body">
            <div th:if="${approvedReviews.isEmpty()}" class="alert alert-info">
                Нет одобренных отзывов
            </div>
            <div th:unless="${approvedReviews.isEmpty()}" class="list-group">
                <div th:each="review : ${approvedReviews}" class="list-group-item">
                    <div class="d-flex justify-content-between">
                        <div>
                            <h6>
                                <span th:text="${review.customer.fullName}"></span>
                                <span class="badge bg-secondary ms-2">⭐ <span th:text="${review.rating}"></span></span>
                                <span class="badge bg-success ms-2">Одобрен</span>
                            </h6>
                            <p class="mb-1" th:text="${review.comment ?: 'Без комментария'}"></p>
                            <small class="text-muted">
                                Товар: <span th:text="${review.product.name}"></span>
                            </small>
                        </div>
                        <div>
                            <form th:action="@{/admin/reviews/delete/{id}(id=${review.id})}" method="post" style="display: inline;">
                                <button type="submit" class="btn btn-sm btn-danger"
                                        onclick="return confirm('Удалить отзыв?')">
                                    🗑️ Удалить
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
